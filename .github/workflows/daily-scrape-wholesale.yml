name: daily-scrape-wholesale

# Re-scrape the wholesale (foodservice) pair register each day, rebuild the
# page, append to the wholesale history series, and commit back. Separate from
# daily-scrape.yml so a wholesale failure never blocks the retail update (and
# vice versa). The scraper is fail-loud: a bot-block or 3+ product failures
# exits non-zero, nothing is written, this run goes red, and the prior
# committed page stays live.
#
# Manual runs only since 2026-11-28. The old `10 5 * * *` cron (05:10 UTC)
# actually started at 13:14 to 15:52 UTC on 17 to 27 Nov 2026 (GitHub delays
# scheduled runs), outside the 04:00-08:45 UTC visit window Brakes' robots.txt
# sets. The daily wholesale scrape now runs on Art's PC inside
# scraper/run_daily_local.ps1 (task "uk-food daily retail scrape", 08:00
# Latvian time = 06:00 UTC in winter, 05:00 UTC in summer; it starts the
# wholesale scrape only between 04:00 and 08:30 UTC). Dispatch this workflow
# by hand only inside that window.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-wholesale:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute run date
        id: vars
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Scrape wholesale pair register
        working-directory: scraper
        run: node run_scrape_wholesale.mjs "${{ steps.vars.outputs.date }}"

      - name: Build page
        run: node scripts/build_page.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "uk-food-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes this run."
          else
            git commit -m "Daily wholesale price update ${{ steps.vars.outputs.date }}"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Retry: since ~24 Nov 2026 the uploaded artifact can take up to ~46 s
      # to become visible, and deploy-pages fails with "No artifacts named
      # github-pages" (actions/deploy-pages#451). Re-running the job does not
      # help (it then finds two artifacts), so wait and retry in the same job.
      - name: Wait for artifact listing
        run: sleep 10
      - name: Deploy to Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
