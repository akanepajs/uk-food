name: daily-scrape

# Re-scrape the pair register, rebuild the page, append the dated rows to the
# history series, and commit back. The scraper is fail-loud: a bot-block or 3+
# product failures exits non-zero, nothing is written, this run goes red, and
# the prior committed page stays live. Mirrors the olas daily-scrape setup.
#
# SCHEDULE REMOVED 2026-07-23: Sainsbury's returns HTTP 403 to GitHub-hosted
# runner IPs (confirmed in two Azure regions), so the daily retail scrape now
# runs on Art's PC via Windows Task Scheduler (scraper/run_daily_local.ps1)
# and pushes; deploy-pages deploys on push. Manual dispatch kept in case the
# block lifts. The check-freshness workflow emails if a day's data is missing.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute run date
        id: vars
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Scrape pair register
        working-directory: scraper
        run: node run_scrape_uk.mjs "${{ steps.vars.outputs.date }}"

      - name: Build page
        run: node scripts/build_page.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "uk-food-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes this run."
          else
            git commit -m "Daily price update ${{ steps.vars.outputs.date }}"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Retry: since ~24 Nov 2026 the uploaded artifact can take up to ~46 s
      # to become visible, and deploy-pages fails with "No artifacts named
      # github-pages" (actions/deploy-pages#451). Re-running the job does not
      # help (it then finds two artifacts), so wait and retry in the same job.
      - name: Wait for artifact listing
        run: sleep 10
      - name: Deploy to Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
